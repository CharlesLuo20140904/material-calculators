<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#173e30">
  <title>Page not found | Project Matter</title>
  <link rel="icon" href="https://charlesluo20140904.github.io/material-calculators/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #f3f0e8; color: #18201b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .message { display: flex; flex-direction: column; justify-content: center; padding: clamp(36px, 8vw, 120px); }
    .code { color: #245b45; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 620px; margin: 18px 0 24px; font-family: Georgia, serif; font-size: clamp(52px, 8vw, 104px); font-weight: 500; letter-spacing: -.05em; line-height: .9; }
    p { max-width: 520px; margin: 0 0 34px; color: #4f5a52; font-size: 17px; line-height: 1.7; }
    a { width: fit-content; padding: 13px 22px; border-radius: 999px; background: #173e30; color: #fffdf7; font-size: 13px; font-weight: 700; text-decoration: none; }
    .plan { display: grid; place-items: center; padding: 48px; border-left: 1px solid rgba(24,32,27,.16); background-image: linear-gradient(rgba(24,32,27,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(24,32,27,.12) 1px, transparent 1px); background-size: 38px 38px; }
    .mark { width: min(70vw, 360px); aspect-ratio: 1; display: grid; place-items: center; border: 1px solid #18201b; border-radius: 50%; background: rgba(243,240,232,.92); color: #173e30; font-family: Georgia, serif; font-size: clamp(92px, 18vw, 180px); }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } .message { min-height: 60vh; } .plan { min-height: 40vh; border-top: 1px solid rgba(24,32,27,.16); border-left: 0; } .mark { width: 210px; font-size: 104px; } }
  </style>
</head>
<body>
  <main>
    <section class="message">
      <span class="code">Error 404 / measure again</span>
      <h1>This page is off the plan.</h1>
      <p>The address may have moved or the measurement may be incomplete. Return to the calculator index and start from a known point.</p>
      <a href="https://charlesluo20140904.github.io/material-calculators/">Return to Project Matter</a>
    </section>
    <div class="plan" aria-hidden="true"><div class="mark">?</div></div>
  </main>
</body>
</html>
